<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- WICHTIG: Das hier schaltet das lästige Zoomen auf Handys aus -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mein Trading Journal</title>
    
    <!-- Chart.js für den Einkommens-Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- FontAwesome für Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* CSS: Modernes, mobiles Dark-Mode Design */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #2962ff;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --green: #00e676;
            --red: #ff1744;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Verhindert das blaue Aufleuchten beim Tippen auf dem Handy */
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            /* Platz für die Bottom Navigation lassen */
            padding-bottom: 80px; 
            overscroll-behavior-y: none; /* Verhindert "Pull-to-refresh" auf iOS, wenn gewünscht */
        }

        /* Header */
        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .sync-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .sync-btn:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        /* Main Content Container */
        .container {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .stat-card .title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .value.profit { color: var(--green); }
        .value.loss { color: var(--red); }

        /* Chart Section */
        .chart-container {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            height: 250px;
        }

        .chart-title {
            font-size: 1rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        /* Recent Trades (Auto-Synced Liste) */
        .trades-list {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
        }

        .trades-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .trade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #333;
        }
        
        .trade-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .trade-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .trade-symbol {
            font-weight: 600;
            font-size: 1rem;
        }

        .trade-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .trade-result {
            font-weight: 600;
            font-size: 1rem;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--card-bg);
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            padding-bottom: calc(10px + env(safe-area-inset-bottom)); /* Für iPhones ohne Home-Button */
            z-index: 20;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item i {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Übersicht</h1>
        <button class="sync-btn" id="syncBtn" onclick="syncTradingView()">
            <i class="fa-solid fa-rotate"></i> Sync
        </button>
    </header>

    <div class="container">
        <!-- Statistik -->
        <div class="stats-grid">
            <div class="stat-card">
                <span class="title">Kontostand</span>
                <span class="value">€10,450.00</span>
            </div>
            <div class="stat-card">
                <span class="title">Gewinn (Monat)</span>
                <span class="value profit">+€450.00</span>
            </div>
            <div class="stat-card">
                <span class="title">Win Rate</span>
                <span class="value">68%</span>
            </div>
            <div class="stat-card">
                <span class="title">Auto-Trades</span>
                <span class="value">24</span>
            </div>
        </div>

        <!-- Einkommens/Performance Chart -->
        <div class="chart-container">
            <h2 class="chart-title">Kontostand (Verlauf)</h2>
            <canvas id="incomeChart"></canvas>
        </div>

        <!-- Automatisch eingetragene Trades -->
        <div class="trades-list">
            <div class="trades-list-header">
                <h2 class="chart-title" style="margin: 0;">Letzte Trades (Paper)</h2>
                <span style="font-size: 0.8rem; color: var(--text-muted);"><i class="fa-solid fa-link"></i> Verbunden</span>
            </div>
            
            <div class="trade-item">
                <div class="trade-info">
                    <span class="trade-symbol">NQ1! (Long)</span>
                    <span class="trade-date">Heute, 14:30</span>
                </div>
                <span class="trade-result" style="color: var(--green);">+€125.00</span>
            </div>

            <div class="trade-item">
                <div class="trade-info">
                    <span class="trade-symbol">ES1! (Short)</span>
                    <span class="trade-date">Gestern, 16:15</span>
                </div>
                <span class="trade-result" style="color: var(--red);">-€50.00</span>
            </div>

            <div class="trade-item">
                <div class="trade-info">
                    <span class="trade-symbol">EURUSD (Long)</span>
                    <span class="trade-date">12. Okt, 09:00</span>
                </div>
                <span class="trade-result" style="color: var(--green);">+€45.00</span>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <i class="fa-solid fa-chart-pie"></i>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-list-ul"></i>
            <span>Trades</span>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
        </a>
    </nav>

    <!-- JavaScript Logik in derselben Datei -->
    <script>
        // Chart.js Konfiguration für den Einkommensverlauf
        const ctx = document.getElementById('incomeChart').getContext('2d');
        const incomeChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'],
                datasets: [{
                    label: 'Kontostand (€)',
                    data: [10000, 10150, 10100, 10300, 10250, 10400, 10450],
                    borderColor: '#2962ff',
                    backgroundColor: 'rgba(41, 98, 255, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4, // Macht die Linie schön kurvig
                    pointRadius: 0, // Versteckt die Punkte für einen cleanen Look
                    pointHitRadius: 10
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false // Legende ausblenden für mehr Platz auf dem Handy
                    }
                },
                scales: {
                    x: {
                        grid: {
                            display: false,
                            drawBorder: false
                        },
                        ticks: {
                            color: '#a0a0a0'
                        }
                    },
                    y: {
                        grid: {
                            color: '#333',
                            drawBorder: false
                        },
                        ticks: {
                            color: '#a0a0a0',
                            // Zeigt nur ein paar Werte an
                            maxTicksLimit: 5
                        }
                    }
                }
            }
        });

        // Funktion für den Sync-Button (Mockup für TradingView Connection)
        function syncTradingView() {
            const btn = document.getElementById('syncBtn');
            const originalText = btn.innerHTML;
            
            // Lade-Animation anzeigen
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Syncing...';
            btn.style.opacity = '0.7';
            
            // Simuliert einen Netzwerk-Request (2 Sekunden)
            setTimeout(() => {
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Synced!';
                btn.style.backgroundColor = 'var(--green)';
                btn.style.opacity = '1';
                
                // Nach weiteren 2 Sekunden wieder auf Normalzustand
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.backgroundColor = 'var(--primary)';
                }, 2000);
                
                // Hier würde später dein Fetch-Request zu deinem Backend stehen,
                // welches die Webhooks oder die API von TradingView ausliest.
                
            }, 1500);
        }
    </script>
</body>
</html>
